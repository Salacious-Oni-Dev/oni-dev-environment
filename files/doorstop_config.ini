# Unity Doorstop 4.x — dev-only configuration for Oxygen Not Included.
#
# Doorstop hooks the Mono runtime before Unity starts it and turns on the soft debugger
# server. That is what makes this release build debuggable; nothing here injects mods, so
# the game's own 0Harmony and Steam Workshop mods are untouched.
#
# Disable everything for one run without editing this file:  set DOORSTOP_DISABLE=1

[General]
enabled = true

# The development patches (DevDoorstop.dll, built from devpatch). It drops doorstop_loaded.txt
# next to the exe so you can tell at a glance that the hook fired, then installs its patches
# once the game's assemblies have loaded.
target_assembly = DevDoorstop.dll

redirect_output_log = false
boot_config_override =
ignore_disable_switch = false

[UnityMono]
dll_search_path_override =

# Mono soft-debugger server. Attach with dnSpy (Debug > Start Debugging > Unity, or
# Debug > Attach to Process > Unity), Rider, or VS with the Unity workload.
debug_enabled = true
debug_address = 127.0.0.1:56000

# true = the game freezes at runtime start until a debugger attaches. Turn this on when you
# need a breakpoint in early startup (Global.Awake, mod loading); leave it off day to day.
debug_suspend = false
